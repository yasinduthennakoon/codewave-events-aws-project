# ============================================================================
# notifications-service/serverless.yml
# ----------------------------------------------------------------------------
# This stack is the showcase for ASYNC AWS patterns:
#
#   1. SQS queue (RegistrationQueue) — other services PUT messages on it when
#      a user registers for an event. A Lambda here consumes and sends emails.
#
#   2. EventBridge Scheduler (modern, NOT the legacy EventBridge Rules) —
#      fires DAILY and invokes a Lambda that finds tomorrow's events and
#      emails reminders. Uses AWS::Scheduler::Schedule + a dedicated IAM role
#      (scheduler.amazonaws.com) instead of the old events.amazonaws.com rule.
#
# This service has NO HTTP endpoints — it's event-driven only.
# ============================================================================
service: cloudwave-notifications

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14

  environment:
    STAGE: ${self:provider.stage}
    # The SES sender address (must be verified in SES; we keep it in SSM
    # so it's easy to change without redeploying.)
    FROM_EMAIL: ${ssm:/cloudwave/${self:provider.stage}/ses/fromEmail}

  iam:
    role:
      statements:
        # Read parameters (Mongo URI, etc.)
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/cloudwave/${self:provider.stage}/*
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'
        # Send email via SES
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

functions:

  # --------------------------------------------------------------------------
  # processRegistrationQueue
  # Consumes messages from the SQS queue. Each message represents one event
  # registration. The handler sends a confirmation email to the registrant.
  # --------------------------------------------------------------------------
  processRegistrationQueue:
    handler: handlers/processRegistrationQueue.handler
    description: SQS consumer — sends registration confirmation emails
    events:
      - sqs:
          arn: !GetAtt RegistrationQueue.Arn
          batchSize: 5
          # If processing fails, message goes back to the queue and is retried.
          # After maxReceiveCount attempts it lands in the DLQ (defined below).

  # --------------------------------------------------------------------------
  # sendReminders
  # Triggered by EventBridge Scheduler every morning (NOT a legacy Rule).
  # The schedule and its IAM role are defined in the resources section below.
  # No `events:` block here — the scheduler invokes the Lambda directly via
  # its own execution role (SchedulerInvokeRole).
  # --------------------------------------------------------------------------
  sendReminders:
    handler: handlers/sendReminders.handler
    description: EventBridge Scheduler job — sends reminder emails for tomorrow's events

resources:
  Resources:

    # --- SQS Queue (main) ----------------------------------------------------
    RegistrationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cloudwave-registrations-${self:provider.stage}
        VisibilityTimeout: 60       # how long a consumer "owns" a message
        MessageRetentionPeriod: 345600   # 4 days
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RegistrationDLQ.Arn
          maxReceiveCount: 3        # after 3 failed attempts → DLQ

    # --- SQS Dead-Letter Queue ----------------------------------------------
    # Failed messages end up here for inspection — never lost.
    RegistrationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cloudwave-registrations-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600  # 14 days

    # --- SQS Queue Policy ---------------------------------------------------
    # Allow other services (the registrations-service Lambda) to send messages
    # to this queue. We grant SendMessage to the same AWS account.
    RegistrationQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref RegistrationQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: sqs:SendMessage
              Resource: !GetAtt RegistrationQueue.Arn

    # --- EventBridge Scheduler (modern replacement for EventBridge Rules) ---
    # AWS::Scheduler::Schedule lives under "Schedules" in the console, not
    # under "Rules". It uses scheduler.amazonaws.com as the principal and
    # requires its own IAM role to invoke the target Lambda.
    SendRemindersSchedule:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: cloudwave-send-reminders-${self:provider.stage}
        Description: 'Daily 09:00 UTC — sends reminder emails for tomorrow''s events'
        # Standard cron — same syntax as legacy rules but lives in the
        # dedicated scheduler service with timezone and flexible-window support.
        ScheduleExpression: cron(0 9 * * ? *)
        ScheduleExpressionTimezone: UTC
        # OFF = fire at exactly the scheduled time (no flexibility window).
        # Use FLEXIBLE + MaximumWindowInMinutes if exact timing doesn't matter.
        FlexibleTimeWindow:
          Mode: 'OFF'
        State: ENABLED
        Target:
          # SLS convention: function name "sendReminders" → CF logical ID "SendRemindersLambdaFunction"
          Arn: !GetAtt SendRemindersLambdaFunction.Arn
          RoleArn: !GetAtt SchedulerInvokeRole.Arn

    # --- IAM Role for EventBridge Scheduler ----------------------------------
    # The scheduler needs its own role to call lambda:InvokeFunction.
    # This is separate from the Lambda execution role.
    SchedulerInvokeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: cloudwave-scheduler-invoke-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: InvokeSendRemindersLambda
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !GetAtt SendRemindersLambdaFunction.Arn

    # --- Lambda permission so the scheduler can invoke this function ---------
    # Without this CloudFormation resource-based policy, the scheduler role
    # alone is not enough — Lambda also checks the function's own policy.
    SendRemindersSchedulerPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt SendRemindersLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: scheduler.amazonaws.com
        SourceArn: !GetAtt SendRemindersSchedule.Arn

    # --- SSM Parameters: publish queue ARN/URL for other services -----------
    SsmRegistrationQueueArn:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /cloudwave/${self:provider.stage}/sqs/registrationQueueArn
        Type: String
        Value: !GetAtt RegistrationQueue.Arn

    SsmRegistrationQueueUrl:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /cloudwave/${self:provider.stage}/sqs/registrationQueueUrl
        Type: String
        Value: !Ref RegistrationQueue

  Outputs:
    RegistrationQueueUrl:
      Value: !Ref RegistrationQueue
    RegistrationQueueArn:
      Value: !GetAtt RegistrationQueue.Arn

package:
  patterns:
    - '!**'
    - 'handlers/**'
    - '../../shared/**'
    - 'node_modules/**'
    - 'package.json'
