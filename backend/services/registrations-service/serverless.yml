# ============================================================================
# registrations-service/serverless.yml
# ----------------------------------------------------------------------------
# Two JWT-protected endpoints:
#   POST /events/{id}/register   — register the calling user for an event
#   GET  /my-registrations       — list everything the calling user registered for
#
# When a user registers, this service:
#   1. Writes the registration to MongoDB.
#   2. Sends an SQS message → notifications-service picks it up & emails them.
# ============================================================================
service: cloudwave-registrations

frameworkVersion: '3'

custom:
  registrationQueueArn: ${ssm:/cloudwave/${self:provider.stage}/sqs/registrationQueueArn}
  registrationQueueUrl: ${ssm:/cloudwave/${self:provider.stage}/sqs/registrationQueueUrl}
  httpApiId:            ${ssm:/cloudwave/${self:provider.stage}/httpApi/id}
  httpApiAuthorizerId:  ${ssm:/cloudwave/${self:provider.stage}/httpApi/authorizerId}

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14

  environment:
    STAGE: ${self:provider.stage}
    # The SQS queue URL is injected so the producer Lambda doesn't have to
    # look it up at runtime.
    REGISTRATION_QUEUE_URL: ${self:custom.registrationQueueUrl}

  iam:
    role:
      statements:
        # Read Mongo URI from SSM
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/cloudwave/${self:provider.stage}/*
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'
        # Send messages to the SQS queue owned by notifications-service
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: ${self:custom.registrationQueueArn}

  httpApi:
    id: ${self:custom.httpApiId}

functions:
  registerForEvent:
    handler: handlers/register.handler
    events:
      - httpApi:
          method: POST
          path: /events/{id}/register
          authorizer:
            id: ${self:custom.httpApiAuthorizerId}

  myRegistrations:
    handler: handlers/list.handler
    events:
      - httpApi:
          method: GET
          path: /my-registrations
          authorizer:
            id: ${self:custom.httpApiAuthorizerId}

package:
  patterns:
    - '!**'
    - 'handlers/**'
    - '../../shared/**'
    - 'node_modules/**'
    - 'package.json'
