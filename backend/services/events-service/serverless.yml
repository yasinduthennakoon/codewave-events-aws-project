# ============================================================================
# events-service/serverless.yml
# ----------------------------------------------------------------------------
# Event CRUD against MongoDB. GET endpoints are public; POST/PUT/DELETE are
# protected by the Cognito JWT authorizer (configured on the HTTP API).
# ============================================================================
service: cloudwave-events

frameworkVersion: '3'

# Resolve Cognito IDs published by auth-service via SSM.
custom:
  httpApiId:          ${ssm:/cloudwave/${self:provider.stage}/httpApi/id}
  httpApiAuthorizerId: ${ssm:/cloudwave/${self:provider.stage}/httpApi/authorizerId}

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14

  environment:
    STAGE: ${self:provider.stage}

  # We read the Mongo URI from SSM at runtime → need ssm:GetParameter + KMS decrypt.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/cloudwave/${self:provider.stage}/*
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'   # the default SSM KMS key — scope down in production

  # Attach to the shared HTTP API owned by auth-service.
  # The JWT authorizer is defined there and referenced here by its AWS ID.
  httpApi:
    id: ${self:custom.httpApiId}

functions:
  # ----------------- PUBLIC -------------------------------------------------
  listEvents:
    handler: handlers/list.handler
    events:
      - httpApi:
          method: GET
          path: /events
          # no `authorizer` key → endpoint is public

  getEvent:
    handler: handlers/get.handler
    events:
      - httpApi:
          method: GET
          path: /events/{id}

  # ----------------- AUTHENTICATED ------------------------------------------
  createEvent:
    handler: handlers/create.handler
    events:
      - httpApi:
          method: POST
          path: /events
          authorizer:
            id: ${self:custom.httpApiAuthorizerId}

  updateEvent:
    handler: handlers/update.handler
    events:
      - httpApi:
          method: PUT
          path: /events/{id}
          authorizer:
            id: ${self:custom.httpApiAuthorizerId}

  deleteEvent:
    handler: handlers/delete.handler
    events:
      - httpApi:
          method: DELETE
          path: /events/{id}
          authorizer:
            id: ${self:custom.httpApiAuthorizerId}

package:
  patterns:
    - '!**'
    - 'handlers/**'
    - '../../shared/**'
    - 'node_modules/**'
    - 'package.json'
