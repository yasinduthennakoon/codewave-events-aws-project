# ============================================================================
# Reusable workflow — deploys ONE serverless service.
# Called by the per-service workflows below.
# ============================================================================
name: Deploy backend service

on:
  workflow_call:
    inputs:
      service:
        description: 'Service folder name under backend/services/'
        required: true
        type: string
      stage:
        description: 'Serverless stage to deploy to'
        required: false
        type: string
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/${{ inputs.service }}/package-lock.json

      - name: Install service dependencies
        working-directory: backend/services/${{ inputs.service }}
        run: npm ci || npm install

      - name: Configure AWS credentials
        # These secrets must be set in your GitHub repo settings.
        # The IAM user/role needs broad rights: Lambda, IAM, API Gateway,
        # Cognito, S3, CloudFront, SQS, EventBridge, SSM, CloudFormation.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy with Serverless Framework
        working-directory: backend/services/${{ inputs.service }}
        run: npx serverless deploy --stage ${{ inputs.stage }}
