# ============================================================================
# backend-deploy.yml
# ----------------------------------------------------------------------------
# Auto-deploys whichever backend microservices have changed on push to main.
# Each service has its own job with a `paths:` filter so we don't redeploy
# things that didn't change. The reusable workflow does the actual work.
# ============================================================================
name: Backend deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy'
        type: string
        default: dev
      force:
        description: 'Deploy all services regardless of what changed'
        type: boolean
        default: false

jobs:
  # --- detect-changes: figures out which services were touched ---------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth:          ${{ steps.filter.outputs.auth }}
      events:        ${{ steps.filter.outputs.events }}
      registrations: ${{ steps.filter.outputs.registrations }}
      files:         ${{ steps.filter.outputs.files }}
      notifications: ${{ steps.filter.outputs.notifications }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each filter watches its own service folder PLUS the shared/ folder
          # (because shared code is bundled into each service's package).
          filters: |
            auth:
              - 'backend/services/auth-service/**'
              - 'backend/shared/**'
            events:
              - 'backend/services/events-service/**'
              - 'backend/shared/**'
            registrations:
              - 'backend/services/registrations-service/**'
              - 'backend/shared/**'
            files:
              - 'backend/services/files-service/**'
              - 'backend/shared/**'
            notifications:
              - 'backend/services/notifications-service/**'
              - 'backend/shared/**'

  # --- one job per service, gated by the filter -----------------------------
  deploy-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true' || inputs.force == true
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: auth-service
      stage: ${{ inputs.stage || 'dev' }}
    secrets: inherit

  # --- seed the authorizer ID into SSM after auth-service deploys -----------
  # Serverless Framework manages HTTP API authorizers outside CloudFormation,
  # so their IDs can't be !Ref-d. We fetch the ID via AWS CLI and write it to
  # SSM so the other services can read it at deploy time.
  seed-authorizer-ssm:
    needs: deploy-auth
    if: needs.deploy-auth.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Fetch authorizer ID and store in SSM
        run: |
          STAGE="${{ inputs.stage || 'dev' }}"
          API_ID=$(aws ssm get-parameter \
            --name "/cloudwave/$STAGE/httpApi/id" \
            --query Parameter.Value --output text)
          AUTH_ID=$(aws apigatewayv2 get-authorizers \
            --api-id "$API_ID" \
            --query 'Items[0].AuthorizerId' --output text)
          aws ssm put-parameter \
            --name "/cloudwave/$STAGE/httpApi/authorizerId" \
            --value "$AUTH_ID" \
            --type String --overwrite

  deploy-notifications:
    needs: detect-changes
    if: needs.detect-changes.outputs.notifications == 'true' || inputs.force == true
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: notifications-service
      stage: ${{ inputs.stage || 'dev' }}
    secrets: inherit

  deploy-files:
    needs: [detect-changes, deploy-auth, seed-authorizer-ssm]
    if: |
      always() &&
      (needs.detect-changes.outputs.files == 'true' || inputs.force == true) &&
      (needs.deploy-auth.result == 'success'         || needs.deploy-auth.result == 'skipped') &&
      (needs.seed-authorizer-ssm.result == 'success' || needs.seed-authorizer-ssm.result == 'skipped')
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: files-service
      stage: ${{ inputs.stage || 'dev' }}
    secrets: inherit

  deploy-events:
    needs: [detect-changes, deploy-auth, seed-authorizer-ssm]
    if: |
      always() &&
      (needs.detect-changes.outputs.events == 'true' || inputs.force == true) &&
      (needs.deploy-auth.result == 'success'         || needs.deploy-auth.result == 'skipped') &&
      (needs.seed-authorizer-ssm.result == 'success' || needs.seed-authorizer-ssm.result == 'skipped')
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: events-service
      stage: ${{ inputs.stage || 'dev' }}
    secrets: inherit

  deploy-registrations:
    needs: [detect-changes, deploy-auth, deploy-notifications, seed-authorizer-ssm]
    if: |
      always() &&
      (needs.detect-changes.outputs.registrations == 'true' || inputs.force == true) &&
      (needs.deploy-auth.result == 'success'         || needs.deploy-auth.result == 'skipped') &&
      (needs.deploy-notifications.result == 'success' || needs.deploy-notifications.result == 'skipped') &&
      (needs.seed-authorizer-ssm.result == 'success' || needs.seed-authorizer-ssm.result == 'skipped')
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: registrations-service
      stage: ${{ inputs.stage || 'dev' }}
    secrets: inherit
